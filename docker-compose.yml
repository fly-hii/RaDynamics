services:
  app:
    build: .
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env.local
    environment:
      - TERRAFORM_PATH=/usr/local/bin/terraform
      - TERRAFORM_WORKSPACE_DIR=/app/terraform/workspaces
